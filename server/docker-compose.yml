version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sdlc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sdlc
      POSTGRES_PASSWORD: sdlc
      POSTGRES_DB: sdlc
    ports:
      - '5433:5432'
    volumes:
      - sdlc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sdlc -d sdlc']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sdlc_pgdata:
    driver: local
